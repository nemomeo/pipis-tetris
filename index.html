<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>阿皮的减脂小方块</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.json?v=2">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1 class="title" data-i18n="title">阿皮的减脂小方块</h1>
    <div class="credit">Cr: chenyalin</div>
    <div class="stats">
      <div class="stat"><span class="label" data-i18n="score">分数</span><span id="score" class="value">0</span></div>
      <div class="stat"><span class="label" data-i18n="level">等级</span><span id="level" class="value">1</span></div>
      <div class="stat"><span class="label" data-i18n="lines">行数</span><span id="lines" class="value">0</span></div>
    </div>
  </header>

  <main class="board-wrap">
    <canvas id="board" width="300" height="600"></canvas>
    <aside class="side">
      <div class="panel">
        <div class="panel-label" data-i18n="next">下一个</div>
        <canvas id="next" width="96" height="96"></canvas>
      </div>
      <div class="panel best">
        <div class="panel-label" data-i18n="best">历史最高分</div>
        <div id="best" class="value best-value">0</div>
        <div id="historyList" class="history-list"></div>
      </div>
    </aside>
  </main>

  <section class="controls">
    <div class="row">
      <button class="btn" id="btnLeft" aria-label="左移">◀</button>
      <button class="btn" id="btnRotate" aria-label="旋转">⟳</button>
      <button class="btn" id="btnRight" aria-label="右移">▶</button>
    </div>
    <div class="row">
      <button class="btn wide" id="btnDown" aria-label="软降" data-i18n="softDrop">▼ 软降</button>
      <button class="btn wide accent" id="btnDrop" aria-label="硬降" data-i18n="hardDrop">⤓ 硬降</button>
    </div>
  </section>

  <footer class="footer">
    <button class="btn ghost" id="btnPause" data-i18n="pause">暂停</button>
    <button class="btn ghost" id="btnRestart" data-i18n="restart">重开</button>
    <button class="btn ghost" id="btnTheme">风格：经典</button>
    <button class="btn ghost" id="btnLang">EN</button>
  </footer>

  <div id="overlay" class="overlay hidden">
    <div class="overlay-card">
      <h2 id="overlayTitle">阿皮的减脂小方块</h2>
      <p class="new-record hidden" id="newRecord" data-i18n="newRecord">新纪录！</p>
      <p class="overlay-score"><span data-i18n="scoreLabel">得分：</span><span id="finalScore">0</span></p>
      <button class="btn accent big" id="btnStart" data-i18n="start">开始游戏</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
